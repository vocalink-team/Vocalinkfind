<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ec"><title>VocalinkFind</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="css/style.css"></head>
<body><main class="app-shell"><header class="app-topbar"><div><a class="brand" href="./">VocalinkFind</a><span class="status-pill" id="authStatus">確認中</span></div><button class="secondary-button small" id="logoutButton">ログアウト</button></header>
<section class="dashboard"><aside class="panel"><p class="eyebrow">MY LOCATION</p><h1>位置情報を共有</h1><p class="muted">自分の現在地を共有し、共有相手の位置を地図で確認できます。</p><button class="primary-button full" id="startLocation">現在地の共有を開始</button><button class="secondary-button full" id="stopLocation">位置情報の更新を停止</button>
<div class="divider"></div><h2>共有を作成</h2><label>共有名<input id="shareTitle" value="位置情報共有"></label><label>有効期限<select id="shareExpiry"><option value="">期限なし</option><option value="1">1時間</option><option value="24">24時間</option><option value="168">7日間</option></select></label><button class="secondary-button full" id="createShare">共有コードを作成</button><div class="share-code" id="shareCode">—</div>
<div class="divider"></div><h2>共有に参加</h2><label>共有コード<input id="joinCode" placeholder="例: VF-7K2P9Q"></label><button class="secondary-button full" id="joinShare">共有に参加</button><p class="form-message" id="message"></p></aside>
<section class="map-panel"><div class="map-header"><div><strong>共有マップ</strong><span id="lastUpdated">位置情報を待っています</span></div><span class="status-pill" id="locationStatus">停止中</span></div><div id="map"></div><div class="member-list" id="memberList"></div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="js/app.js"></script></body></html>
