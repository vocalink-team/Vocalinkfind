<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ec"><title>VocalinkFind - ログイン</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="auth-shell"><section class="auth-card"><a class="brand" href="./">VocalinkFind</a><p class="eyebrow">LOCATION SHARING</p><h1>位置情報を<br>つなげる。</h1><p class="lead">ログインして、共有相手と位置情報を安全に共有できます。</p><form id="authForm"><label>メールアドレス<input id="email" type="email" autocomplete="email" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button class="primary-button" type="submit">ログイン</button><button class="secondary-button" id="signupButton" type="button">アカウントを作成</button><p class="form-message" id="message"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script></body></html>
